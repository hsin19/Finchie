version: '3'

vars:
  BUF: go run github.com/bufbuild/buf/cmd/buf@v1.75.0

includes:
  backend:
    taskfile: apps/backend/Taskfile.yml
    dir: apps/backend
  parser:
    taskfile: apps/parser/Taskfile.yml
    dir: apps/parser
  web:
    taskfile: apps/web/Taskfile.yml
    dir: apps/web
  mailbox:
    taskfile: apps/mailbox/Taskfile.yml
    dir: apps/mailbox

tasks:
  proto:
    desc: Lint proto/ and regenerate Go and Python code (commit the output)
    cmds:
      - '{{.BUF}} format -w'
      - '{{.BUF}} lint'
      - '{{.BUF}} generate'

  proto:deps:
    desc: Update buf.lock (googleapis)
    cmds:
      - '{{.BUF}} dep update'

  proto:check:
    desc: Fail on unformatted, unlinted, or backward-incompatible proto changes
    cmds:
      - task: proto:lint
      - task: proto:breaking

  proto:lint:
    desc: Fail on unformatted or unlinted proto files
    cmds:
      - '{{.BUF}} format --diff --exit-code'
      - '{{.BUF}} lint'

  proto:breaking:
    desc: Fail on backward-incompatible changes against a git ref (AGAINST=<ref>, default main)
    vars:
      AGAINST: '{{.AGAINST | default "main"}}'
    # Skipped while the ref has no contracts to compare against.
    status:
      - '! git cat-file -e "{{.AGAINST}}:proto/finchie" 2>/dev/null'
    cmds:
      - '{{.BUF}} breaking --against ".git#ref={{.AGAINST}}"'

  shellcheck:
    desc: Lint the repository's shell scripts
    cmds:
      - shellcheck .github/scripts/*.sh

  check:
    desc: Everything CI runs, except the generated-code check (it needs a clean working tree)
    cmds:
      - task: proto:check
      - task: parser:check
      - task: backend:check
      - task: web:check
      - task: mailbox:check
      - task: shellcheck
