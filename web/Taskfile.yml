version: '3'

tasks:
  install:
    desc: Install dependencies (the pnpm version is pinned in package.json)
    cmds:
      - pnpm install --frozen-lockfile

  generate:
    desc: Regenerate the API types from services/backend/api/openapi.yaml; commit the output
    cmds:
      - pnpm run api:generate

  fmt:
    desc: Fix formatting
    cmds:
      - pnpm run format

  lint:
    desc: dprint, ESLint, and svelte-check
    cmds:
      - pnpm run format:check
      - pnpm run lint
      - pnpm run typecheck

  test:
    desc: Unit tests
    cmds:
      - pnpm test

  build:
    desc: Build the static app into build/
    cmds:
      - pnpm build

  check:
    desc: Everything CI runs for the web app
    cmds:
      - task: lint
      - task: test
      - task: build

  dev:
    desc: Vite dev server on :5173; /api goes to the backend on :8080 (task backend:run)
    cmds:
      - pnpm dev
