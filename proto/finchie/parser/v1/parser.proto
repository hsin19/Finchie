syntax = "proto3";

package finchie.parser.v1;

import "google/protobuf/timestamp.proto";
import "google/type/date.proto";
import "google/type/decimal.proto";

// Turns a raw financial document into structured data, and opens one for a
// person to read. Stateless: the caller owns storage, retries, and
// deduplication (ADR 0002, ADR 0005).
service ParserService {
  // Status codes carry the retry decision:
  //   UNIMPLEMENTED       no parser recognizes the document (do not retry)
  //   INVALID_ARGUMENT    the file is unreadable (do not retry)
  //   FAILED_PRECONDITION the PDF password is missing or wrong (do not retry)
  //   INTERNAL            a known statement no longer matches its parser (do not retry)
  //   UNAVAILABLE         transient (retry)
  // An unbalanced statement is still OK; see Reconciliation.
  rpc ParseDocument(ParseDocumentRequest) returns (ParseDocumentResponse);

  // Opens a document for a person to read: an e-mail's headers, body, and
  // attachments, or a bare PDF as its one file. A PDF comes back decrypted
  // when it opens without a password or with a configured one, so the reader
  // never needs the password (ADR 0012).
  //   UNIMPLEMENTED       neither an e-mail nor a PDF
  //   INVALID_ARGUMENT    the file is unreadable
  rpc OpenDocument(OpenDocumentRequest) returns (OpenDocumentResponse);
}

message ParseDocumentRequest {
  // The caller's document ID, echoed in logs and traces on both sides.
  string document_id = 1;
  string filename = 2;
  // "message/rfc822" for an e-mail, "application/pdf" for a bare PDF.
  string content_type = 3;
  bytes content = 4;
}

message OpenDocumentRequest {
  // The caller's document ID, echoed in logs and traces on both sides.
  string document_id = 1;
  string filename = 2;
  // As in ParseDocumentRequest.
  string content_type = 3;
  bytes content = 4;
}

message OpenDocumentResponse {
  // Unset for a bare PDF.
  Email email = 1;
  // The e-mail's attachments in order, or the bare PDF.
  repeated File files = 2;
}

message Email {
  // Header values with encoded words decoded, e.g. "國泰世華銀行 <bank@example.com>".
  string sender = 1;
  string recipient = 2;
  string subject = 3;
  // Unset when the message has no readable Date header.
  google.protobuf.Timestamp date = 4;
  // The body to show, HTML when the message has it, else plain text; at most
  // one is set. Images the HTML references by Content-ID are embedded as data:
  // URIs, so it needs nothing else to display.
  string html = 5;
  string text = 6;
}

message File {
  string filename = 1;
  // "application/pdf" when the bytes are a PDF, else as the e-mail declares it.
  string content_type = 2;
  bytes content = 3;
  // A PDF that none of the configured passwords opens, returned as received.
  bool locked = 4;
  // The one file that stands for the document: the PDF whose name a bank
  // parser knows as its statement, else the first PDF. None without a PDF.
  bool primary = 5;
}

message ParseDocumentResponse {
  // Which parser handled the document, e.g. "taishin.credit_card".
  string parser = 1;
  // Bumped whenever the parser's output for the same input can change, so the
  // caller knows what to re-parse.
  string parser_version = 2;
  Statement statement = 3;
  // Problems that did not stop parsing, e.g. OCR text that could not be read.
  repeated string warnings = 4;
}

message Statement {
  // Stable institution ID: "esun", "taishin", "cathay", "hsbc".
  string institution = 1;
  google.type.Date closing_date = 2;
  google.type.Date due_date = 3;
  // ISO 4217 code of the statement, e.g. "TWD".
  string currency = 4;
  // Amount due for this statement, as printed.
  google.type.Decimal total_due = 5;
  repeated Transaction transactions = 6;
  Reconciliation reconciliation = 7;
}

// Amounts follow the statement's sign: charges positive, credits negative
// (ADR 0004).
message Transaction {
  google.type.Date transaction_date = 1;
  // Unset when the statement does not print a posting date.
  google.type.Date posting_date = 2;
  string description = 3;
  TransactionKind kind = 4;
  // In the statement's currency.
  google.type.Decimal amount = 5;
  // Set for foreign transactions: the amount and ISO 4217 currency as charged.
  google.type.Decimal original_amount = 6;
  string original_currency = 7;
  // ISO 3166-1 alpha-2 country of the merchant, when printed.
  string country = 8;
  // Last four digits of the card, when the statement lists several cards.
  string card_last4 = 9;
}

enum TransactionKind {
  TRANSACTION_KIND_UNSPECIFIED = 0;
  TRANSACTION_KIND_PURCHASE = 1;
  TRANSACTION_KIND_FOREIGN_TRANSACTION_FEE = 2;
  // Annual fees and their waivers (negative).
  TRANSACTION_KIND_ANNUAL_FEE = 3;
  TRANSACTION_KIND_REFUND = 4;
  // Cash back and points redeemed against the bill.
  TRANSACTION_KIND_REBATE = 5;
  TRANSACTION_KIND_PAYMENT = 6;
}

// Each bank parser picks which lines make up the statement's new charges and
// which printed amount they must add up to.
message Reconciliation {
  bool balanced = 1;
  google.type.Decimal computed = 2;
  google.type.Decimal stated = 3;
  // The statement's own label for `stated`, e.g. "本期新增款項".
  string stated_label = 4;
}
