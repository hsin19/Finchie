name: Check

# The one definition of "is this tree good": proto contracts, generated code, and lint + tests for each
# service. pr.yml and release.yml call it, so PRs and releases meet the same bar. main has no deploy
# workflow, so pushes to main run it here as well. Every check runs through Task, the same commands as
# locally (`task check`).
on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proto:
    name: Proto contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # What the contracts have to stay compatible with: main for a PR (or a run by hand on a branch),
      # the previous tip for a push to main. A release tag's commit was compared when it reached main,
      # and a newer main is no baseline for an older tag.
      - name: Fetch the baseline for breaking changes
        id: baseline
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            *:refs/tags/*)
              echo "Release tag: no baseline" ;;
            push:refs/heads/main)
              if [[ "$BEFORE" =~ ^0+$ ]]; then
                echo "New branch: no baseline"
              else
                git fetch --no-tags --depth=1 origin "$BEFORE"
                echo "ref=$BEFORE" >> "$GITHUB_OUTPUT"
              fi ;;
            *:refs/heads/main)
              echo "Run by hand on main: no baseline" ;;
            *)
              git fetch --no-tags --depth=1 origin +refs/heads/main:refs/heads/main
              echo "ref=main" >> "$GITHUB_OUTPUT" ;;
          esac

      # buf runs through `go run`.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      - name: Setup Task
        uses: go-task/setup-task@v2

      - name: Format and lint
        run: task proto:lint

      - name: Breaking changes
        if: ${{ !cancelled() && steps.baseline.outputs.ref != '' }}
        run: task proto:breaking AGAINST="$AGAINST"
        env:
          AGAINST: ${{ steps.baseline.outputs.ref }}

  generated:
    name: Generated code is committed
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      - name: Setup Task
        uses: go-task/setup-task@v2

      - name: Regenerate
        run: task proto backend:generate

      - name: Compare with the commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::Generated code is stale: run 'task proto backend:generate' and commit the result"
            exit 1
          fi

  parser:
    name: Parser
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/parser/uv.lock

      - name: Setup Task
        uses: go-task/setup-task@v2

      - name: Install
        id: install
        run: task parser:install

      # One step per check, gated on `!cancelled()`, so a single run reports every failure.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: task parser:lint

      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: task parser:test

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      - name: Setup Task
        uses: go-task/setup-task@v2

      - name: Build
        id: build
        run: task backend:build

      - name: Lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: task backend:lint

      # Integration tests start Postgres with testcontainers; the runner has Docker.
      - name: Tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: task backend:test

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The pnpm version comes from packageManager in apps/web/package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Cache dprint plugins
        uses: actions/cache@v6
        with:
          path: ~/.cache/dprint
          key: dprint-${{ runner.os }}-${{ hashFiles('apps/web/dprint.jsonc') }}

      - name: Setup Task
        uses: go-task/setup-task@v2

      - name: Install
        id: install
        run: task web:install

      # One step per check, gated on `!cancelled()`, so a single run reports every failure.
      - name: API types match the OpenAPI spec
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          task web:generate
          if ! git diff --exit-code -- apps/web/src/lib/api/schema.d.ts; then
            echo "::error::apps/web/src/lib/api/schema.d.ts is stale: run 'task web:generate' and commit the result"
            exit 1
          fi

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: task web:lint

      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: task web:test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: task web:build

  mailbox:
    name: Mailbox
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The pnpm version comes from packageManager in apps/mailbox/package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/mailbox/package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/mailbox/.node-version
          cache: pnpm
          cache-dependency-path: apps/mailbox/pnpm-lock.yaml

      - name: Cache dprint plugins
        uses: actions/cache@v6
        with:
          path: ~/.cache/dprint
          key: dprint-${{ runner.os }}-${{ hashFiles('apps/mailbox/dprint.jsonc') }}

      - name: Setup Task
        uses: go-task/setup-task@v2

      - name: Install
        id: install
        run: task mailbox:install

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: task mailbox:lint

      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: task mailbox:test

      # Bundles the Worker without deploying it: deploys are by hand (ADR 0010).
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: task mailbox:build

  scripts:
    name: Shell scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Task
        uses: go-task/setup-task@v2

      # shellcheck ships with the ubuntu runner image.
      - name: ShellCheck
        run: task shellcheck
